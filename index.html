<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raul Contreras | Webmaster Terminal</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="src/pages/about.html">About</a>
    <a href="src/pages/roadmap.html">Roadmap</a>
    <a href="src/pages/projects.html">Projects</a>
  </nav>

  <main>
    <h1>Raul Contreras | Matrix Terminal</h1>
    <p>AI & Software Engineer Portfolio</p>

    <!-- Markdown Container -->
    <div id="markdown-content">Loading content...</div>
  </main>

  <script src="src/js/app.js"></script>
  <script>
    // Fetch and render index.md from docs-md/
    fetch('docs-md/index.md')
      .then(response => {
        if (!response.ok) throw new Error('Markdown file not found');
        return response.text();
      })
      .then(text => {
        document.getElementById('markdown-content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('markdown-content').innerHTML = '<p>Welcome to my terminal portfolio!</p>';
      });
  </script>



<script src="src/js/app.js"></script>
<script>
  // Path from root index.html to docs-md/index.md
  loadMarkdownContent('docs-md/index.md', 'markdown-content', '<p>Welcome to my terminal portfolio!</p>');
</script>


</body>




</html>
