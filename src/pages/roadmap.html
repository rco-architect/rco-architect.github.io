<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webmaster Roadmap | Raul Contreras</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <nav>
    <a href="../../index.html">Home</a>
    <a href="about.html">About</a>
    <a href="roadmap.html">Roadmap</a>
    <a href="projects.html">Projects</a>
  </nav>

  <main>
    <h1>Webmaster Curriculum Roadmap</h1>

    <!-- Markdown Container -->
    <div id="markdown-content">Loading roadmap...</div>
  </main>

  <script src="../js/app.js"></script>
  <script>
    fetch('../../docs-md/roadmap.md')
      .then(response => {
        if (!response.ok) throw new Error('Markdown file not found');
        return response.text();
      })
      .then(text => {
        document.getElementById('markdown-content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('markdown-content').innerHTML = `
          <h2>Phase 1: Fundamentals</h2>
          <ul>
            <li>HTML5 Semantic Structure</li>
            <li>CSS3 Flexbox & Grid Layouts</li>
            <li>Git & GitHub Deployment</li>
          </ul>
          <h2>Phase 2: Advanced Engineering</h2>
          <ul>
            <li>JavaScript ES6+ & DOM Manipulation</li>
            <li>HTTP, Server Administration & Cloudflare</li>
            <li>CI/CD Workflows</li>
          </ul>
        `;
      });
  </script>


<script src="src/js/app.js"></script>
<script>
  // Path from root index.html to docs-md/index.md
  loadMarkdownContent('docs-md/roadmap.md', 'markdown-content', '<p>Welcome to my terminal portfolio!</p>');
</script>


</body>
</html>
